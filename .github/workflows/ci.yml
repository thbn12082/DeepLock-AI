name: ci

on:
  push:
  pull_request:

jobs:
  content-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './content_builder[test]'
      - run: pytest content_builder/tests
      - run: python -m deeplock_content.cli inspect --input fixtures/gradient_descent.md --workdir .build/content

  android-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: cd android && ./gradlew verifyNoNetworkPermission verifyNoNetworkDependencies verifyBundledPack testDebugUnitTest assembleRelease
      - name: Secret and forbidden SDK scan
        shell: bash
        run: |
          ! grep -R -E 'sk-[A-Za-z0-9_-]{20,}|android.permission.INTERNET' android/app/src
          ! grep -R -E 'okhttp|retrofit|ktor-client|firebase-messaging|openai' android/app/build.gradle.kts
